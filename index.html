/* ===== V45 : fusion 3 cartes — animation style reroll / LoL ===== */
.fusion{background:linear-gradient(180deg,#181221,#100d16);border:1px solid #352847;border-radius:16px;padding:14px;margin:12px 0 18px;box-shadow:0 12px 28px #0005}
.fusion .dhero{align-items:center}
.frow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fcard{background:#0d0a12;border:1px solid #32273f;border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;min-height:48px;box-shadow:0 6px 14px #0004}
.fcard span:first-child{font-weight:800;min-width:0}
.fcard .btn{padding:7px 12px;font-size:12px;white-space:nowrap}
.fusion .fmeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.fusion .fmeta span{background:#0b0912;border:1px solid #31283d;border-radius:999px;padding:5px 9px;color:#bdb4ca;font-size:11px;font-weight:800}
.fusion .fmeta strong{color:#f4e7ff}
#fusionOverlay{position:fixed;inset:0;z-index:300;background:radial-gradient(circle at 50% 45%,#3b1d63aa,transparent 38%),rgba(4,2,9,.97);display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(10px)}
.fusionStage{width:min(1120px,96vw);height:min(820px,94vh);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;border:1px solid #59436f;border-radius:26px;background:radial-gradient(circle at 50% 48%,#24143a 0%,#100c17 48%,#07050b 100%);box-shadow:0 30px 100px #000c,0 0 100px #a855f733}
.fusionTitle{font-size:clamp(24px,3vw,38px);font-weight:950;letter-spacing:.02em;margin-bottom:6px;position:relative;z-index:20}
.fusionSub{color:#aa9eb8;font-size:13px;margin-bottom:18px;position:relative;z-index:20}
.fusionSlots{position:absolute;left:50%;top:49%;width:min(760px,82vw);height:min(470px,54vh);transform:translate(-50%,-50%);z-index:8;perspective:1200px}
.fusionSlot{position:absolute;width:clamp(150px,18vw,205px);aspect-ratio:2/3;left:50%;top:50%;margin:-102px 0 0 -75px;filter:drop-shadow(0 22px 34px #000d);opacity:0;transform-origin:50% 50%;}
.fusionSlot .card{width:100%;height:100%;cursor:default}
.fusionSlot::after{content:"";position:absolute;inset:-10px;border-radius:18px;box-shadow:0 0 0 1px #fff2,0 0 30px #a855f733;pointer-events:none}
.fusionPlus{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:950;color:#b9aec4;opacity:.8;z-index:12;pointer-events:none}
.fusionSlot:nth-child(1){--sx:-1;--sy:.12;--sr:-14deg}
.fusionSlot:nth-child(3){--sx:1;--sy:.12;--sr:14deg}
.fusionSlot:nth-child(5){--sx:0;--sy:-.02;--sr:0deg}
.fusionStage.active .fusionSlot:nth-child(1){animation:fusionOrbitLeft 2.3s cubic-bezier(.18,.72,.16,1) .12s forwards}
.fusionStage.active .fusionSlot:nth-child(3){animation:fusionOrbitRight 2.3s cubic-bezier(.18,.72,.16,1) .12s forwards}
.fusionStage.active .fusionSlot:nth-child(5){animation:fusionOrbitTop 2.3s cubic-bezier(.18,.72,.16,1) .12s forwards}
.fusionStage.active .fusionPlus{animation:fusionPlusFade 1s ease .9s forwards}
.fusionCore{position:absolute;left:50%;top:49%;width:150px;height:150px;transform:translate(-50%,-50%) scale(.2);border-radius:50%;opacity:0;z-index:5;background:radial-gradient(circle,#fff 0 4%,#f6ddff 10%,#d28cff 20%,#8b5cf6 38%,transparent 72%);box-shadow:0 0 42px #c084fcbb,0 0 130px #a855f755}
.fusionCore::before,.fusionCore::after{content:"";position:absolute;left:50%;top:50%;border-radius:50%;border:1px solid #fff5;transform:translate(-50%,-50%);}
.fusionCore::before{width:230px;height:230px}.fusionCore::after{width:340px;height:340px;border-color:#c084fc44}
.fusionStage.active .fusionCore{animation:fusionCoreCharge 1.35s ease .95s both}
.fusionBurst{position:absolute;left:50%;top:49%;width:18px;height:18px;transform:translate(-50%,-50%);border-radius:50%;opacity:0;z-index:15;background:#fff;box-shadow:0 0 25px #fff,0 0 75px #d8b4fe,0 0 150px #a855f7}
.fusionStage.reveal .fusionBurst{animation:fusionBurstBig 1.05s cubic-bezier(.1,.7,.2,1) both}
.fusionResultWrap{position:absolute;left:50%;top:49%;width:min(320px,58vw);transform:translate(-50%,-50%) scale(.2) rotateY(90deg);display:flex;align-items:center;justify-content:center;z-index:20;opacity:0;pointer-events:none}
.fusionStage.reveal .fusionResultWrap{animation:fusionResultHero 1.15s cubic-bezier(.12,.9,.22,1.18) .05s forwards}
.fusionResult{width:100%;filter:drop-shadow(0 26px 55px #000e)}
.fusionResult .card{width:100%;cursor:default}
.fusionResultTag{margin-top:12px;font-size:13px;font-weight:950;letter-spacing:.1em;text-transform:uppercase;color:#f8edff;text-shadow:0 0 18px #a855f7}
.fusionChance{position:absolute;left:0;right:0;bottom:30px;color:#8f849d;font-size:11px;z-index:20}
.fusionDone{position:absolute;left:0;right:0;bottom:58px;min-height:24px;z-index:20;color:#ddd5e8;font-size:12px}
.fusionDone .btn{display:none}
.fusionStage.reveal .fusionDone{animation:fusionFade .6s ease .9s both}
@keyframes fusionOrbitLeft{0%{opacity:0;transform:translate(calc(-50% - 255px),18px) rotateZ(-22deg) rotateY(-16deg) scale(.78)}18%{opacity:1}50%{transform:translate(calc(-50% - 175px),-34px) rotateZ(-9deg) rotateY(-28deg) scale(.9)}78%{transform:translate(calc(-50% + 8px),-4px) rotateZ(105deg) rotateY(-58deg) scale(.7)}100%{opacity:0;transform:translate(-50%,-50%) rotateZ(330deg) rotateY(360deg) scale(.18)}}

@keyframes fusionOrbitTop{0%{opacity:0;transform:translate(-50%,-180px) rotateZ(0) rotateY(0) scale(.8)}18%{opacity:1}52%{transform:translate(-50%,-104px) rotateZ(0) rotateY(180deg) scale(.95)}80%{transform:translate(-50%,0) rotateZ(160deg) rotateY(300deg) scale(.75)}100%{opacity:0;transform:translate(-50%,-50%) rotateZ(360deg) rotateY(540deg) scale(.18)}}
@keyframes fusionPlusFade{0%{opacity:.85;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}}

/* ===== V43 : refonte visuelle des cartes ===== */
.card{
 --edge:#59606b;
 --surface:#10131a;
 --surface2:#171b24;
 --ink:#f5f7fb;
 aspect-ratio:2/3;
 border-radius:16px;
 padding:2px;
 cursor:pointer;
 position:relative;
 transition:transform .16s ease-out,box-shadow .2s ease;
 transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--s,1));
 background:linear-gradient(145deg,#343a45,#11151c 38%,#5b6573 58%,#141821);
 box-shadow:0 10px 24px rgba(0,0,0,.24);
}
.card::before{
 content:"";
 position:absolute;
 inset:0;
 border-radius:16px;
 pointer-events:none;
 z-index:5;
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),inset 0 0 0 2px rgba(0,0,0,.35);
}
.card .in{
 height:100%;
 border-radius:14px;
 background:linear-gradient(180deg,var(--surface2),var(--surface));
 display:flex;
 flex-direction:column;
 overflow:hidden;
 position:relative;

<script id="wc-restore">
(function(){
 const SKIP=/^wc_(rank|films)/;
 const keys=()=>{const a=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&(k.startsWith("wc_")||k.startsWith("ACCOUNT_"))&&!SKIP.test(k))a.push(k)}return a};
 const snap=()=>{const d={};keys().forEach(k=>{d[k]=localStorage.getItem(k)});return{v:2,t:Date.now(),site:"WikiCollect",d}};
 const has=d=>{try{return Object.keys(JSON.parse(d.wc_col||"{}")).length>0}catch(e){return false}};
 const idb=()=>new Promise((res,rej)=>{try{const r=indexedDB.open("wikicollect_backup",1);r.onupgradeneeded=()=>r.result.createObjectStore("b");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
 const put=(k,v)=>idb().then(db=>new Promise((res,rej)=>{const t=db.transaction("b","readwrite");t.objectStore("b").put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})).catch(()=>{});
 const get=k=>idb().then(db=>new Promise(res=>{const q=db.transaction("b").objectStore("b").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})).catch(()=>null);
 const W=window.WCSAVE={keys,snap,has,put,get,ready:false,last:0,block:false};
 W.backup=async()=>{if(!W.ready||W.block)return;const s=snap();if(!has(s.d))return;const prev=await get("last");if(prev&&s.t-prev.t>36e5)await put("prev",prev);await put("last",s);W.last=s.t};
 if(!has(snap().d)&&!sessionStorage.getItem("wc_restored")){
  // navigateur vidé : on récupère la copie de secours (IndexedDB), puis on recharge une seule fois
  Promise.all([get("last"),get("prev")]).then(([a,b])=>{const best=[a,b].filter(x=>x&&x.d&&has(x.d)).sort((x,y)=>y.t-x.t)[0];
   if(best){W.block=true;Object.keys(best.d).forEach(k=>localStorage.setItem(k,best.d[k]));sessionStorage.setItem("wc_restored","1");location.reload()}else W.ready=true});
 }else W.ready=true;
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();
</script>

/* ===== FILMS : 1000 films de toutes les époques, avec affiche obligatoire ===== */
const FILM_GZ_URL="https://quantavil.github.io/imdb-dataset/titles.json.gz";
const FILM_JSON_URL="https://quantavil.github.io/imdb-dataset/titles.json";
const FILM_CACHE_KEY="wc_films_1000_v1";
let FILMS=[],FILMS_READY=false,FILMS_LOADING=null;
const FILM_BUCKETS=[
  [2020,2026,150],[2010,2019,220],[2000,2009,180],[1990,1999,150],[1980,1989,100],[1970,1979,70],[1960,1969,50],[1950,1959,40],[1900,1949,40]
];
function filmScore(m){
 const rating=Math.max(0,Math.min(1,(+m.rating-5)/5));
 const votes=Math.min(1,Math.log10(Math.max(10,+m.votes||10)+1)/7);
 const pop=m.popularity!=null?1-Math.min(1,Math.log10(Math.max(1,+m.popularity)+1)/5.5):.28;
 const y=+m.year||0,rec=y>=2020?.10:y>=2010?.07:y>=2000?.045:y>=1990?.025:0;
 return rating*.34+votes*.42+pop*.19+rec*.05;
}
function filmRarity(i){
 if(i<15)return 7; if(i<65)return 6; if(i<190)return 5; if(i<410)return 4; if(i<650)return 3; if(i<820)return 2; if(i<930)return 1; return 0;
}
function makeFilm(m,r){
 const year=+m.year||0,title=String(m.title||m.original_title||"").trim(),id=String(m.id||"").trim(),poster=String(m.poster||"").trim();
 return {
   id:`f-${id}-${r}`,pid:id,t:title+(year?` (${year})`:""),baseTitle:title,year,genres:m.genres||"",rating:+m.rating||0,v:+m.votes||0,
   d:`Film${year?` — ${year}`:""}${m.genres?` · ${m.genres}`:""}${m.cast?` · ${m.cast.split(",").slice(0,2).join(", ")}`:""}`,
   img:poster,r,src:"film",url:id?`https://www.imdb.com/title/${id}/`:"",nsfw:false,filmRank:m.rank||null
 };
}
async function loadFilms(){
 if(FILMS_READY)return FILMS;
 if(FILMS_LOADING)return FILMS_LOADING;
 FILMS_LOADING=(async()=>{
   try{
     let cached=null;try{cached=JSON.parse(localStorage.getItem(FILM_CACHE_KEY)||"null")}catch(e){}
     if(cached&&Array.isArray(cached)&&cached.length===1000){FILMS=cached;FILMS_READY=true;return FILMS}
     let payload=null;
     try{
       const r=await fetch(FILM_GZ_URL,{cache:"no-cache"});
       if(!r.ok)throw new Error("Films: téléchargement impossible");
       if("DecompressionStream" in window){
         const stream=r.body.pipeThrough(new DecompressionStream("gzip"));
         payload=JSON.parse(await new Response(stream).text());
       }else throw new Error("gzip navigateur indisponible");
     }catch(e){
       const r=await fetch(FILM_JSON_URL,{cache:"no-cache"});
       if(!r.ok)throw new Error("Films: source indisponible");
       payload=await r.json();
     }
     const fields=payload.fields||[], data=Array.isArray(payload.data)?payload.data:[], ix=Object.fromEntries(fields.map((f,i)=>[f,i]));
     const rows=data.map(row=>({id:row[ix.id],title:row[ix.title],original_title:row[ix.original_title],type:row[ix.type],year:row[ix.year],rating:row[ix.rating],votes:row[ix.votes],genres:row[ix.genres],is_adult:row[ix.is_adult],poster:row[ix.poster],cast:row[ix.cast],popularity:row[ix.popularity],rank:row[ix.rank]}));
     let pool=rows.filter(m=>m&&m.type==="movie"&&m.poster&&m.is_adult!==1&&m.title&&(+m.votes||0)>=1500);
     pool.forEach(m=>m.__score=filmScore(m));
     const used=new Set(),selected=[];
     for(const [lo,hi,n] of FILM_BUCKETS){
       const band=pool.filter(m=>{const y=+m.year||0;return !used.has(m.id)&&y>=lo&&y<=hi}).sort((a,b)=>b.__score-a.__score||(+b.votes||0)-(+a.votes||0));
       for(const m of band.slice(0,n)){used.add(m.id);selected.push(m)}
     }
     if(selected.length<1000){
       const rem=pool.filter(m=>!used.has(m.id)).sort((a,b)=>b.__score-a.__score||(+b.votes||0)-(+a.votes||0));
       for(const m of rem){if(selected.length>=1000)break;used.add(m.id);selected.push(m)}
     }
     if(selected.length<1000)throw new Error(`Seulement ${selected.length} films avec affiche disponibles`);
     selected.sort((a,b)=>b.__score-a.__score||(+b.votes||0)-(+a.votes||0));
     FILMS=selected.slice(0,1000).map((m,i)=>makeFilm(m,filmRarity(i)));
     try{localStorage.setItem(FILM_CACHE_KEY,JSON.stringify(FILMS))}catch(e){}
     FILMS_READY=true;return FILMS;
   }catch(e){
     console.warn("Catalogue films indisponible",e);FILMS=[];FILMS_READY=true;return FILMS;
   }
 })();
 return FILMS_LOADING;
}

/* V2 CATEGORY RARITY ENGINE
   - categories are inferred from existing real card titles/metadata
   - rarity is ranked inside the category, not only globally
   - explicit OVR/TIER_ANCHORS always win
   - no synthetic category-name cards are created
*/
const CAT_RARITY_META={
 foot:["football","footballeur","footballeuse","joueur de football","joueuse de football","ligue 1","champions league","coupe du monde"],
 act:["acteur","actrice","cinéma","film","réalisateur","réalisatrice"],

 game:["jeu vidéo","jeu vidéo","gaming","esport","playstation","xbox","nintendo"],
 film:["film","long métrage","court métrage","cinéma"],
 animal:["mammifère","oiseau","poisson","reptile","amphibien","insecte","araignée","animal","espèce animale","dinosaure"],
 plant:["plante","fleur","arbre","arbuste","botanique","champignon"],
 science:["scientifique","physicien","physicienne","mathématicien","mathématicienne","astronome","astronomie","science"],
 place:["ville","commune","capitale","pays","métropole","géographie","monument","quartier","lieu"],
 vehicle:["automobile","voiture","constructeur automobile","formule 1","pilote automobile","avion","aéronef","navire","bateau","train","moto"],
 book:["roman","livre","écrivain","écrivaine","auteur","autrice","œuvre littéraire"],
 hist:["histoire","historique","personnalité historique","guerre","révolution"],
 sport:["sportif","sportive","athlète","tennis","basket-ball","boxe","mma","cyclisme","natation","athlétisme"],
 myth:["mythologie","mythologique","dieu","déesse","divinité","légende"],
 food:["cuisine","aliment","plat","recette","fromage","dessert","boisson"],
 tech:["technologie","informatique","logiciel","entreprise","smartphone","ordinateur","internet"],
 event:["attentat","catastrophe","événement","incendie","naufrage","tremblement de terre","pandémie"],
 creator:["youtubeur","youtubeuse","streameur","streameuse","créateur de contenu","créatrice de contenu","influenceur","influenceuse"],
 adult:["pornographique","pornographie","actrice de films pornographiques","acteur de films pornographiques","star du porno","modèle érotique"],
 anime:["anime","animé","manga","shōnen","shoujo"],
 space:["astronomie","planète","étoile","galaxie","constellation","satellite","astéroïde","espace"]
};
const CAT_STATS={};
const CAT_TITLE_MAP={};
const _catNorm=x=>nz2(x);
function inferCardCategory(e){
  if(e?.g && CAT_RARITY_META[e.g]) return e.g;
  if(e?.cr) return "creator";
  if(e?.src==="film") return "film";
  const t=String(e?.t||"").toLowerCase();
  const d=String(e?.d||"").toLowerCase();
  const hay=t+" "+d;
  // Prefer explicit CATALOG membership: it is curated with real Wikipedia titles.
  for(const [g,z] of Object.entries(CATALOG||{})){
    for(const k of [7,6,5,4,3,2,1,0]){
      const a=String(z["t"+k]||"").split("|").filter(Boolean);
      if(a.some(x=>_catNorm(x)===_catNorm(e.t))) return g;
    }
  }
  // Stronger/specific domains first.
  const order=["adult","creator","anime","space","foot","sport","vehicle","game","film","music","animal","plant","science","place","book","hist","myth","food","tech","event","act"];
  for(const g of order){
    if((CAT_RARITY_META[g]||[]).some(k=>hay.includes(k))) return g;
  }
  return null;
}
function buildCategoryStats(list){
  for(const k of Object.keys(CAT_STATS)) delete CAT_STATS[k];
  (list||[]).forEach(e=>{
    const g=inferCardCategory(e);
    if(!g || !Number.isFinite(+e.v)) return;
    (CAT_STATS[g]||(CAT_STATS[g]=[])).push({t:e.t,v:+e.v,r:e.r});
  });
  Object.keys(CAT_STATS).forEach(g=>{
    const a=CAT_STATS[g].sort((x,y)=>y.v-x.v);
    // Keep a compact rank lookup for fast rarity decisions.
    CAT_STATS[g]=a;
  });
}
function categoryRankRarity(title,views,g){
  const a=CAT_STATS[g];
  if(!a || a.length<12 || !Number.isFinite(+views)) return null;
  const v=+views;
  let pos=a.findIndex(x=>x.v<=v);
  if(pos<0) pos=a.length-1;
  const q=a.length<=1?0:pos/(a.length-1);
  // Deliberately top-heavy: the biggest names in each domain rise much faster.
  if(q<=0.015) return 7;
  if(q<=0.045) return 6;
  if(q<=0.10) return 5;
  if(q<=0.20) return 4;
  if(q<=0.36) return 3;
  if(q<=0.58) return 2;
  if(q<=0.80) return 1;
  return 0;
}

function chooseCaseCard(r,pool){

  // momentanément aucune carte du rang demandé. On prend le rang disponible
  // le plus proche, sans inventer une carte absente du catalogue.
  const ranks=[...new Set(valid.map(c=>c.r))].sort((x,y)=>Math.abs(x-r)-Math.abs(y-r)||x-y);

   'Chanteur français','Chanteuse française','Chanteur américain','Chanteuse américaine','Chanteur britannique','Chanteuse britannique','Groupe musical','K-pop','Groupe de K-pop','Idole sud-coréenne','Chanteur sud-coréen','Chanteuse sud-coréenne','Musicien','Musicienne',
   'YouTubeur','Youtubeuse','Streamer','Streameuse','Personnalité d Internet','Personnalité du web','Créateur de contenu',

   'Animal','Insecte','Araignée','Poisson','Oiseau','Reptile','Mammifère','Dinosaure','Plante','Fleur','Arbre','Champignon','Bactérie','Virus','Espèce animale','Espèce végétale',
   'Astronomie','Étoile','Galaxie','Planète','Exoplanète','Objet céleste','Physicien','Mathématicien','Scientifique','Chimiste','Biologiste','Médecin','Ingénieur',
   'Écrivain français','Écrivain américain','Écrivain britannique','Poète','Artiste','Peintre','Sculpteur','Photographe','Personnalité historique','Chef d État','Monarque','Empereur','Impératrice','Roi','Reine',
   'Ville','Capitale','Pays','Commune de France','Monument historique','Architecture','Château','Cathédrale','Église','Musée','Pont','Stade','Aéroport','Gare',
   'Entreprise','Marque automobile','Automobile','Moto','Train','Avion','Hélicoptère','Bateau','Navire','Technologie','Informatique','Logiciel','Smartphone',
   'Cuisine française','Plat','Fromage','Dessert','Boisson','Livre','Album musical','Chanson','Compétition sportive','Trophée sportif','Événement historique','Guerre','Catastrophe naturelle','Événement culturel'
  ];
  const seeds=[...new Set(SEEDS)]; let dbp=null;
  const db=()=>dbp||(dbp=new Promise((resolve,reject)=>{const q=indexedDB.open(DBN,DBV);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains(STORE)){const st=d.createObjectStore(STORE,{keyPath:'k'});st.createIndex('title','title',{unique:false});st.createIndex('r','r',{unique:false})}if(!d.objectStoreNames.contains(META))d.createObjectStore(META,{keyPath:'k'})};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)}));
  const tx=(sn,mode,fn)=>db().then(d=>new Promise((res,rej)=>{const t=d.transaction(sn,mode),st=t.objectStore(sn);let o;try{o=fn(st)}catch(e){rej(e);return}t.oncomplete=()=>res(o);t.onerror=()=>rej(t.error)}));
  const get=k=>tx(STORE,'readonly',s=>new Promise((r,j)=>{const q=s.get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>j(q.error)}));
  const putMany=a=>a.length?tx(STORE,'readwrite',s=>a.forEach(x=>s.put(x))):Promise.resolve();
  const metaGet=k=>tx(META,'readonly',s=>new Promise((r,j)=>{const q=s.get(k);q.onsuccess=()=>r(q.result?.v);q.onerror=()=>j(q.error)}));
  const metaSet=(k,v)=>tx(META,'readwrite',s=>s.put({k,v}));
  const count=()=>tx(STORE,'readonly',s=>new Promise((r,j)=>{const q=s.count();q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)}));
  const sample=async(limit=600)=>tx(STORE,'readonly',s=>new Promise((res,rej)=>{
    const out=[],seen=new Set(); let r=7;
    const next=()=>{
      if(out.length>=limit||r<0){res(out);return;}
      const q=s.index('r').openCursor(IDBKeyRange.only(r),'next');
      q.onsuccess=e=>{
        const c=e.target.result;
        if(!c){r--;next();return;}
        if(c.value?.img&&!seen.has(c.value.k)){
          seen.add(c.value.k);
          out.push({id:'v4-'+c.value.k,pid:'v4-'+c.value.k,t:c.value.title,r:c.value.r,v:c.value.v||0,img:c.value.img,src:'wiki',d:c.value.desc||'',url:c.value.url,cats:c.value.cats||[]});
        }
        if(out.length>=limit){res(out);return;}
        c.continue();
      };
      q.onerror=()=>rej(q.error);
    };
    next();
  }));
  /* V116 : cartes tirées au hasard n'importe où dans le catalogue, pour une rareté donnée (counts = {rareté: nombre}) */
  const randomSample=async(counts)=>{const out=[];
   for(const [rs,n] of Object.entries(counts||{})){const r=+rs;
    const total=await tx(STORE,'readonly',s=>new Promise((res,rej)=>{const q=s.index('r').count(IDBKeyRange.only(r));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}));
    if(!total)continue;
    const want=Math.min(n,total),pk=new Set();let g=0;while(pk.size<want&&g++<want*6)pk.add(Math.floor(Math.random()*total));
    const offs=[...pk].sort((a,b)=>a-b);
    await tx(STORE,'readonly',s=>new Promise((res,rej)=>{const q=s.index('r').openCursor(IDBKeyRange.only(r));let j=0,pos=0;
     q.onsuccess=e=>{const c=e.target.result;if(!c){res();return}
      if(pos===offs[j]){const v=c.value;if(v&&v.img)out.push({id:'v4-'+v.k,pid:'v4-'+v.k,t:v.title,r:v.r,v:v.v||0,img:v.img,src:'wiki',d:v.desc||'',url:v.url,cats:v.cats||[]});j++}
      if(j>=offs.length){res();return}
      const step=offs[j]-pos;pos=offs[j];c.advance(Math.max(1,step))};
     q.onerror=()=>rej(q.error)}));
   }
   return out};
  async function api(params){
   const u=new URL(API);Object.entries(params||{}).forEach(([k,v])=>u.searchParams.set(k,v));u.searchParams.set("origin","*");
   let last=null;
   for(let n=0;n<4;n++){
    const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),15000);
    try{
     const r=await fetch(u.toString(),{method:"GET",mode:"cors",credentials:"omit",cache:"no-store",headers:{"Accept":"application/json"},signal:ac.signal});
     if(!r.ok)throw Error("HTTP "+r.status);
     const ct=(r.headers.get("content-type")||"").toLowerCase();
     if(ct&&!ct.includes("json"))throw Error("Réponse non-JSON");
     return await r.json();
    }catch(e){last=e}finally{clearTimeout(tm)}
    if(n<3)await sleep(800*(n+1));
   }
   throw last||Error("Wikipédia inaccessible");
  }
  /*
   * Rareté V4.2 : notoriété réelle avant catégorie.
   * Les vues sont mesurées sur 30 jours. La portée internationale et
   * la couverture encyclopédique servent seulement de départage.
   */
  const rarity=(t,pv,cats=[],meta={})=>{
    const forced=OV[norm(t)];
    if(forced!=null)return forced;
    const views=Math.max(0,Number(pv)||0);
    const langs=Math.max(0,Number(meta.langs)||0);
    const length=Math.max(0,Number(meta.length)||0);
    let r =
      views>=3000000 ? 6 :
      views>=1500000 ? 5 :
      views>=500000  ? 4 :
      views>=150000  ? 3 :
      views>=30000   ? 2 :
      views>=5000    ? 1 : 0;
    if(langs>=80 && r>=2) r++;
    else if(langs>=30 && r>=2) r++;
    if(length>=120000 && r>=3) r++;
    return Math.min(6,r);
  };
  async function pageInfo(titles){if(!titles.length)return[];const j=await api({action:'query',prop:'pageimages|description|info|pageviews|langlinks',inprop:'url',piprop:'thumbnail',pithumbsize:'500',pilicense:'free',pvipdays:'30',lllimit:'100',titles:titles.join('|'),formatversion:'2'});return j.query?.pages||[]}
  async function ingest(pages,cats,{refresh=false}={}){
    const rows=[];
    for(const p of pages){
      const t=title(p.title),k=norm(t);
      if(!p.thumbnail?.source||!k||bad.test(t)||p.missing)continue;
      const old=await get(k);
      if(old?.img&&!refresh)continue;
      const pv=p.pageviews?Object.values(p.pageviews).reduce((a,b)=>a+(Number(b)||0),0):0;
      const langs=Array.isArray(p.langlinks)?p.langlinks.length:0;
      const length=Number(p.length)||0;
      const r=rarity(t,pv,cats,{langs,length});
      rows.push({
        ...(old||{}),k,title:t,id:old?.id||'wiki-v41-'+String(p.pageid),
        r,v:pv,img:p.thumbnail.source,desc:p.description||old?.desc||'',
        url:p.fullurl||old?.url||('https://fr.wikipedia.org/wiki/'+encodeURIComponent(t.replace(/ /g,'_'))),
        src:'wiki',cats:[...new Set([...(old?.cats||[]),...cats])],
        langs,length,pop:Math.round(Math.min(100,
          Math.log10(1+pv)/7*75 +
          Math.min(langs,100)/100*15 +
          Math.min(length,120000)/120000*10
        )),updatedAt:Date.now()
      });
    }
    if(rows.length)await putMany(rows);
    return rows;
  }
  async function refreshExisting(limit=200){
    const keys=[];
    await tx(STORE,'readonly',st=>new Promise((resolve,reject)=>{
      const cur=st.openCursor();
      cur.onsuccess=e=>{
        const c=e.target.result;
        if(!c||keys.length>=limit){resolve();return;}
        if(c.value?.img&&c.value?.url)keys.push(c.value.title);
        c.continue();
      };
      cur.onerror=()=>reject(cur.error);
    }));
    for(let i=0;i<keys.length;i+=50){
      try{await ingest(await pageInfo(keys.slice(i,i+50)),['refresh'],{refresh:true})}
      catch(e){console.warn('refresh batch',e)}
      await sleep(250);
    }
    return keys.length;
  }
  let running=false;
  async function crawlCategory(root,state){
    state.catQueue=state.catQueue||[];state.doneCats=state.doneCats||{};
    if(!state.catQueue.length)state.catQueue=[{cat:root,depth:0,cont:''}];
    while(state.catQueue.length&&(await count())<TARGET){const item=state.catQueue.shift(),ck=norm(item.cat);if(item.depth>MAX_CAT_DEPTH)continue;if(state.doneCats[ck]&&!item.cont)continue;
      const j=await api({action:'query',list:'categorymembers',cmtitle:'Catégorie:'+item.cat,cmtype:'page|subcat',cmnamespace:'0|14',cmlimit:'500',...(item.cont?{cmcontinue:item.cont}:{})});
      const pages=[],subs=[];for(const x of Object.values(j.query?.categorymembers||{})){if(x.ns===14){subs.push({cat:x.title.replace(/^Catégorie:/i,''),depth:item.depth+1,cont:''})}else if(x.ns===0)pages.push(x.title)}
      for(const sub of subs){const sk=norm(sub.cat);if(!state.doneCats[sk]&&sub.depth<=MAX_CAT_DEPTH&&!state.catQueue.some(x=>norm(x.cat)===sk&&!x.cont))state.catQueue.push(sub)}
      for(let i=0;i<pages.length&&await count()<TARGET;i+=BATCH){try{const rows=await ingest(await pageInfo(pages.slice(i,i+BATCH)),[root,item.cat]);state.added=(state.added||0)+rows.length}catch(e){console.warn('batch',e)}state.processed=(state.processed||0)+Math.min(BATCH,pages.length-i);await metaSet('state',state);await sleep(WAIT)}
      const next=j.continue?.cmcontinue||'';if(next)state.catQueue.push({cat:item.cat,depth:item.depth,cont:next});else state.doneCats[ck]=1;await metaSet('state',state);
      console.log('📚',root,'→',await count(),'cartes · file',state.catQueue.length);
    }
  }
  async function run(){if(running)return;running=true;try{await db();let st=await metaGet('state')||{seed:0,added:0,processed:0,catQueue:[],doneCats:{},globalCursor:''};
    const beforeCol=(()=>{try{return Object.keys(JSON.parse(localStorage.getItem('wc_col')||'{}')).length}catch{return -1}})(),beforeMoney=localStorage.getItem('wc_money');
    console.log('🎴 WikiCollect V4.2 — objectif',TARGET.toLocaleString('fr-FR'),'· collection protégée',beforeCol,'· WikiCo',beforeMoney);
    try{const refreshed=await refreshExisting(200);console.log('🔄 Rareté/notoriété réévaluées :',refreshed,'cartes')}catch(e){console.warn('refresh rarity',e)}
    for(;st.seed<seeds.length&&(await count())<TARGET;st.seed++){const root=seeds[st.seed];console.log(`🚀 [${st.seed+1}/${seeds.length}] ${root}`);try{await crawlCategory(root,st)}catch(e){console.warn('Catégorie ignorée/reprise',root,e)}st.catQueue=[];st.doneCats={};await metaSet('state',st)}
    while((await count())<TARGET){const j=await api({action:'query',list:'allpages',apnamespace:'0',aplimit:'500',...(st.globalCursor?{apcontinue:st.globalCursor}:{})});const titles=(j.query?.allpages||[]).map(x=>x.title);if(!titles.length)break;for(let i=0;i<titles.length&&await count()<TARGET;i+=BATCH){try{const rows=await ingest(await pageInfo(titles.slice(i,i+BATCH)),['Catalogue Wikipédia FR']);st.added=(st.added||0)+rows.length}catch(e){console.warn('allpages',e)}await metaSet('state',st);await sleep(WAIT)}st.globalCursor=j.continue?.apcontinue||'';await metaSet('state',st);if(!st.globalCursor)break}
    const afterCol=(()=>{try{return Object.keys(JSON.parse(localStorage.getItem('wc_col')||'{}')).length}catch{return -1}})();const afterMoney=localStorage.getItem('wc_money');console.log('━━━━━━━━━━━━━━━━━━━━');console.log('✅ Catalogue V4.1 :',(await count()).toLocaleString('fr-FR'),'cartes avec image');console.log('➕ nouvelles cartes :',(st.added||0).toLocaleString('fr-FR'));console.log('🛡️ Collection',beforeCol,'→',afterCol,'· WikiCo',beforeMoney,'→',afterMoney);console.log('💾 Progression persistante dans IndexedDB');
  }catch(e){console.error('❌ WCV4.1',e)}running=false}
  async function queryPage(opts={}){
    const page=Math.max(1,opts.page|0),size=Math.min(50,Math.max(1,opts.size||50)),term=norm(opts.q||''),rs=Array.isArray(opts.rarities)?opts.rarities.map(Number):[],az=opts.sort==='az',skip=(page-1)*size;
    const make=c=>({id:'v4-'+c.k,pid:'v4-'+c.k,t:c.title,r:c.r,v:c.v||0,pop:c.pop||0,langs:c.langs||0,length:c.length||0,img:c.img,src:'wiki',d:c.desc||'',url:c.url});
    return tx(STORE,'readonly',s=>new Promise((resolve,reject)=>{
      const out=[];let matched=0;
      const accept=c=>!!c?.img&&(!rs.length||rs.includes(c.r))&&(!term||norm(c.title).includes(term));
      if(az){
        const cur=s.index('title').openCursor(null,'next');
        cur.onsuccess=e=>{const c=e.target.result;if(!c){resolve({rows:out,matched});return;}if(accept(c.value)){if(matched>=skip&&out.length<size)out.push(make(c.value));matched++;}if(out.length>=size){resolve({rows:out,matched});return;}c.continue()};
        cur.onerror=()=>reject(cur.error);return;
      }
      const ranks=rs.length?rs:[7,6,5,4,3,2,1,0];let ri=0;
      const openRank=()=>{
        if(ri>=ranks.length){resolve({rows:out,matched});return;}
        const cur=s.index('r').openCursor(IDBKeyRange.only(ranks[ri]),'prev');
        cur.onsuccess=e=>{const c=e.target.result;if(!c){ri++;openRank();return;}if(accept(c.value)){if(matched>=skip&&out.length<size)out.push(make(c.value));matched++;}if(out.length>=size){resolve({rows:out,matched});return;}c.continue()};
        cur.onerror=()=>reject(cur.error);
      };
      openRank();
    }));
  }

  window.wcCatalogV41={start:run,count,progress:async()=>console.table(await metaGet('state')||{}),sample,randomSample,queryPage,resetProgress:async()=>{await metaSet('state',{seed:0,added:0,processed:0,catQueue:[],doneCats:{},globalCursor:''});console.log('Progression remise à zéro — catalogue conservé.')}};
  db().catch(()=>{});setTimeout(run,1200);
})();

<script id="wc-v41-integration">
/* ===== V4.1 : branche le gros catalogue sur Toutes les cartes + cases + boosters ===== */
(()=>{
 if(window.__WCV41Integration)return;window.__WCV41Integration=true;
 const wait=fn=>setTimeout(fn,1800);
 const catalogPage=async()=>{
  /* V4.1 reste actif pour les boosters/cases, tandis que Toutes les cartes
     réutilise le moteur de pagination Wikipédia complet d'origine. */
  if(window.__wcOldAll) return window.__wcOldAll();
 };
 const oldAll=all;window.__wcOldAll=oldAll;all=catalogPage;
 /* V121 : mémoire des pages déjà vues + préchargement silencieux de la page suivante (Toutes les cartes) */
 {const _collect=collect,MEM=new Map(),TTL=6e5,ctx=()=>[SO,CG,q,[...fr].sort().join()].join("¦");
  const run=(cur,c)=>{const k=c+"¦"+cur,e=MEM.get(k);if(e&&Date.now()-e.t<TTL)return e.p;const p=_collect(cur);MEM.set(k,{t:Date.now(),p});p.catch(()=>MEM.delete(k));if(MEM.size>14)MEM.delete(MEM.keys().next().value);return p};
  collect=function(cur){const c=ctx(),p=run(cur,c);p.then(r=>{if(r&&r.next&&ctx()===c&&tab===1)setTimeout(()=>{if(ctx()===c&&tab===1)run(r.next,c)},300)}).catch(()=>{});return p}}
 const oldLoad=loadCasePool;
 loadCasePool=async function(need){let pool=await oldLoad(need);try{if(window.wcCatalogV41){const extra=await window.wcCatalogV41.sample(700);const seen=new Set(pool.map(c=>c.id));extra.forEach(c=>{if(c.img&&(!need||c.r>=need)&&!seen.has(c.id)){seen.add(c.id);pool.push(c);store[c.id]=c}})}}catch(e){}return pool};
 const oldBuild=buildPack;
 buildPack=async function(minRarity=null){return oldBuild(minRarity)};
 const oldChoose=typeof chooseCaseCard==='function'?chooseCaseCard:null;
 wait(()=>{try{if(typeof render==='function'&&typeof tab!=='undefined'&&tab===1)all()}catch(e){}});
 console.log('🔌 WikiCollect V4.1 connecté : Toutes les cartes / Card Case / boosters utilisent le nouveau catalogue quand disponible.');
})();

<script id="wc-final-features-js">
(()=>{
  if(window.__WCFINALFEATURES)return; window.__WCFINALFEATURES=true;
  const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const availableStore=()=>Object.values(store||{}).filter(c=>c&&c.img);
  const catalogCount=async()=>{
    try{if(window.wcCatalogV41&&window.wcCatalogV41.count)return await window.wcCatalogV41.count()}catch(e){}
    return availableStore().length;
  };
  const openCatalogCard=async()=>{
    try{
      const db=await new Promise((res,rej)=>{const r=indexedDB.open('WikiCollectCatalogV41');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
      const st=db.transaction('cards','readonly').objectStore('cards');
      const counts=[];for(let r=0;r<=7;r++)counts[r]=await new Promise(ok=>{const q=st.index('r').count(IDBKeyRange.only(r));q.onsuccess=()=>ok(q.result||0);q.onerror=()=>ok(0)});
      const total=counts.reduce((a,b)=>a+b,0);if(total){let x=Math.floor(Math.random()*total),rar=0;for(;rar<counts.length;rar++){if(x<counts[rar])break;x-=counts[rar]}
        const c=await new Promise(ok=>{const q=st.index('r').openCursor(IDBKeyRange.only(rar),'next');let n=x;q.onsuccess=e=>{const cur=e.target.result;if(!cur){ok(null);return}if(n--<=0){const v=cur.value;ok(v?.img?{id:'v4-'+v.k,pid:'v4-'+v.k,t:v.title,r:v.r,v:v.v||0,pop:v.pop||0,img:v.img,src:'wiki',d:v.desc||'',url:v.url,cats:v.cats||[],langs:v.langs||0,length:v.length||0}:null);return}cur.continue()};q.onerror=()=>ok(null)});
        if(c){store[c.id]=c;return c}
      }
    }catch(e){}
    const L=availableStore();return L.length?L[Math.floor(Math.random()*L.length)]:null;
  };
  const discover=async()=>{
    try{bumpDaily('discover',1)}catch(e){}
    const host=document.createElement('div');host.id='wcDiscoverOverlay';host.className='modal';host.style.display='flex';host.innerHTML='<div id="wcDiscoverBody" style="min-height:250px;display:grid;place-items:center"><div class="msg">Recherche d’une carte…</div></div></div>';document.body.appendChild(host);
    const close=()=>host.remove();host.querySelector('#wcDx').onclick=close;
    const c=await openCatalogCard();const body=host.querySelector('#wcDiscoverBody');
    if(!c){body.innerHTML='<div class="msg">Aucune carte avec image n’est actuellement disponible.</div>';return}
    const cat=(c.cats&&c.cats.length?c.cats[0]:(c.src==='cr'?'Créateur':'Wikipédia'));
    const pop=Number(c.pop||0);const views=Number(c.v||0);
    body.innerHTML=`<div class="wc-discover"><img src="${esc(c.img)}" referrerpolicy="no-referrer" alt="${esc(c.t)}"><div class="wc-discover-info"><h3>${esc(c.t)}</h3><div class="wc-discover-meta"><span class="wc-pill">${esc(cat)}</span><span class="wc-pill">${esc(rarityName(c.r))}</span><span class="wc-pill">⭐ Popularité ${pop?pop.toFixed(0):'—'}</span><span class="wc-pill">👁 ${views.toLocaleString('fr-FR')} vues Wikipédia</span></div><p class="mut" style="line-height:1.55">${esc(c.d||'Aucune description disponible pour cette carte.')}</p><div class="wc-discover-actions"><button class="btn" id="wcWish">${isW(c)?'⭐ Retirer de ma liste':'⭐ Ajouter à ma liste de souhaits'}</button><button class="btn g" id="wcAll">🌍 Voir dans Toutes les cartes</button><button class="btn g" id="wcAgain">🎲 Une autre carte</button></div></div></div>`;
    host.querySelector('#wcWish').onclick=()=>{toggleW(c);host.querySelector('#wcWish').textContent=isW(c)?'⭐ Retirer de ma liste':'⭐ Ajouter à ma liste de souhaits'};
    host.querySelector('#wcAgain').onclick=()=>{close();setTimeout(discover,0)};
    host.querySelector('#wcAll').onclick=()=>{window.__wcFocusCard=c;tab=1;q='';page=1;close();render()};
  };
  window.wcDiscover=discover;
  const _mission=missionsPage;
  missionsPage=function(){
    loadDaily();
    const done=DAILY.filter(m=>WCQ.c[m.id]).length;
    main.classList.add('wc-no-scroll-page');
    const cards=DAILY.map(m=>{const p=WCQ.p[m.id]||0,claimed=!!WCQ.c[m.id],pct=Math.min(100,Math.round(p/m.goal*100));return `<div class="mission"><div style="display:flex;justify-content:space-between;gap:6px;align-items:flex-start"><div><b>${esc(m.name)}</b><small>${p} / ${m.goal}</small></div><b style="color:#ffd23c;font-size:11px">+${m.reward} 🪙</b></div><div class="dbar"><i style="width:${pct}%"></i></div><button class="btn ${claimed||p<m.goal?'g':''}" data-claim="${m.id}" ${claimed||p<m.goal?'disabled':''}>${claimed?'✅ Pris':p>=m.goal?'🎁 Réclamer':'En cours'}</button></div>`}).join('');
    main.innerHTML=`<h2>🎯 Missions du jour</h2><div class="sub">${done}/${DAILY.length} terminées · les missions se renouvellent chaque jour.</div><div class="mtimer">⏳ Nouvelles missions dans <b id="mt">…</b></div><div class="wc-mission-grid">${cards}</div>`;mTimer();
    main.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{const m=DAILY.find(x=>x.id===b.dataset.claim);if(!m||WCQ.c[m.id]||(WCQ.p[m.id]||0)<m.goal)return;WCQ.c[m.id]=1;gain(m.reward);try{localStorage.setItem('wc_daily2',JSON.stringify(WCQ))}catch(e){}toast('🎁 Mission terminée : +'+m.reward+' 🪙');missionsPage()});
  };
  const _success=succesPage;
  succesPage=function(){
    const U=achCheck(),n=ACH.filter(a=>U[a.id]).length,pct=Math.round(n/ACH.length*100),list=ACH.filter(a=>ACHF==='all'||(ACHF==='ok')===!!U[a.id]);
    main.classList.add('wc-no-scroll-page');
    main.innerHTML=`<h2>🏆 Succès</h2><div class="sub">${n} / ${ACH.length} débloqués · chaque succès rapporte des pièces.</div><div class="wc-ach-wrap"><div class="dbox"><div style="display:flex;justify-content:space-between"><span>Progression</span><b style="color:#7cf5b0">${pct}%</b></div><div class="dbar" style="margin-top:6px"><i style="width:${pct}%"></i></div></div><div class="bar">${[['all','Tous'],['ok','Débloqués'],['no','À débloquer']].map(([k,l])=>`<button class="btn ${ACHF===k?'':'g'}" data-f="${k}">${l}</button>`).join('')}</div><div class="wc-ach-grid">${list.map(a=>{const ok=!!U[a.id];let v=0;try{v=a.v()}catch(e){}return `<div class="ach ${ok?'':'lock'}"><div class="aic">${a.ic}</div><div class="atx"><b>${esc(a.n)}${ok?' <span class="aok">✔</span>':''}</b><div class="ad">${esc(a.d)}</div><div class="ar">+${a.rw} 🪙${ok?'':' · '+Math.min(Math.floor(v),a.goal).toLocaleString('fr-FR')+' / '+a.goal.toLocaleString('fr-FR')}</div></div></div>`}).join('')||'<div class="msg">Rien à afficher ici.</div>'}</div></div>`;
    main.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ACHF=b.dataset.f;succesPage()});
  };
  /* 8 — Statistiques avancées + Encyclopédie + Collections / Sets */
  const statsHTML=async()=>{
    const A=Object.values(col).filter(c=>c&&c.n>0),uniq=A.length,total=A.reduce((s,c)=>s+c.n,0),value=A.reduce((s,c)=>s+fair(c)*c.n,0),cre=A.filter(c=>c.src==='cr').length,dupes=A.filter(c=>c.n>1).length;
    const counts=R.map((_,i)=>A.filter(c=>c.r===i).reduce((s,c)=>s+c.n,0));
    const catNames=[['⚽ Football',/foot|football|joueur|joueuse|club/i],['🎵 Musique',/musique|chanteur|chanteuse|groupe|album|chanson|k-pop/i],['🎬 Cinéma & séries',/acteur|actrice|film|série|cinéma|anime|manga/i],['🎮 Jeux vidéo',/jeu vidéo|personnage de jeu|nintendo|playstation|xbox/i],['🐾 Animaux',/animal|mammifère|oiseau|poisson|reptile|insecte|araignée/i],['🔬 Science',/science|physicien|chimie|biolog|astronom|mathématique/i],['🌍 Géographie',/ville|pays|commune|région|géograph|monument/i],['🎥 Créateurs',/youtube|streamer|créateur|twitch/i]];
    const indexed=await catalogCount();
    const setCards=catNames.map(([name,re])=>{const av=availableStore().filter(c=>re.test((c.cats||[]).join(' ')+' '+c.t));const owned=new Set(A.filter(c=>re.test((c.cats||[]).join(' ')+' '+c.t)).map(c=>c.id));const pct=av.length?Math.min(100,Math.round(owned.size/av.length*100)):0;return {name,owned:owned.size,total:av.length,pct}});
    return `<div class="wc-feature-panel"><h3>📊 Statistiques avancées</h3><div class="wc-feature-grid"><div class="wc-stat"><b>${uniq.toLocaleString('fr-FR')}</b><span>Cartes différentes</span></div><div class="wc-stat"><b>${total.toLocaleString('fr-FR')}</b><span>Cartes possédées au total</span></div><div class="wc-stat"><b>${value.toLocaleString('fr-FR')} 🪙</b><span>Valeur estimée</span></div><div class="wc-stat"><b>${cre.toLocaleString('fr-FR')}</b><span>Créateurs dans la collection</span></div><div class="wc-stat"><b>${dupes.toLocaleString('fr-FR')}</b><span>Cartes avec doublons</span></div><div class="wc-stat"><b>${rarityName(A.length?Math.max(...A.map(c=>c.r)):-1)}</b><span>Plus haute rareté</span></div><div class="wc-stat"><b>${indexed.toLocaleString('fr-FR')}</b><span>Cartes actuellement indexées</span></div><div class="wc-stat"><b>${Object.keys(WL).length.toLocaleString('fr-FR')}</b><span>Liste de souhaits</span></div></div><div class="wc-rarity-bars">${R.map((r,i)=>{const n=counts[i]||0,p=total?Math.round(n/total*100):0;return `<div class="rb" style="--rc:${r[1]};--rw:${p}%"><b>${esc(r[0])}</b><span> ${n.toLocaleString('fr-FR')} · ${p}%</span><i></i></div>`}).join('')}</div></div><div class="wc-feature-panel"><h3>🥇 Collections / Sets</h3><div class="sub">Progression calculée sur les cartes actuellement indexées dans ton catalogue.</div><div class="wc-set-grid">${setCards.map(s=>`<div class="wc-set"><b>${s.name}</b><small>${s.owned} / ${s.total} · ${s.pct}%</small><div class="dbar"><i style="width:${s.pct}%"></i></div></div>`).join('')}</div></div><div class="wc-feature-panel"><h3>🥈 Encyclopédie</h3><div class="sub">Pas de faux objectif à 3 millions : WikiCollect suit les cartes que tu peux réellement obtenir avec image.</div><div class="wc-feature-grid"><div class="wc-stat"><b>${indexed.toLocaleString('fr-FR')}</b><span>Cartes disponibles / indexées</span></div><div class="wc-stat"><b>${uniq.toLocaleString('fr-FR')}</b><span>Déjà collectionnées</span></div><div class="wc-stat"><b>${Math.max(0,indexed-uniq).toLocaleString('fr-FR')}</b><span>Encore à découvrir</span></div><div class="wc-stat"><b>${indexed?Math.min(100,(uniq/indexed*100)).toFixed(2):'0.00'}%</b><span>Encyclopédie complétée</span></div></div></div>`;
  };
  const appendProfileFeatures=()=>{const holder=document.createElement('div');holder.id='wcProfileFeatures';holder.innerHTML='<div class="msg">Chargement des statistiques…</div>';main.appendChild(holder);statsHTML().then(x=>{if(document.getElementById('wcProfileFeatures'))holder.innerHTML=x}).catch(()=>{holder.innerHTML='<div class="msg">Statistiques momentanément indisponibles.</div>'})};
  const _profile=profilePage;
  profilePage=function(){main.classList.remove('wc-no-scroll-page');_profile();appendProfileFeatures();};
  /* 10 — Laboratoire de cartes + bouton Découvrir dans le classeur */
  const appendLab=()=>{
    const A=Object.values(col).filter(c=>c&&c.n>0),ready=A.filter(c=>c.n>=3&&c.r<7).length;
    const el=document.createElement('div');el.className='wc-feature-panel';
    el.innerHTML=`<h3>🧪 Laboratoire de cartes</h3><div class="sub">Transforme tes doublons en cartes de rareté supérieure.</div><div class="wc-lab-grid"><div class="wc-lab-card"><b>⚗️ Fusion par rareté</b><p class="mut">3 exemplaires de la même carte → 1 exemplaire de cette carte avec la rareté supérieure.</p><div class="wc-rarity-bars" style="margin-top:10px">${R.slice(0,7).map((r,i)=>`<div class="rb" style="--rc:${r[1]};--rw:100%"><b>${esc(r[0])}</b><span>3 → ${esc(rarityName(i+1))}</span><i></i></div>`).join('')}</div><button class="btn" id="wcLabFusion" style="margin-top:12px">⚗️ Ouvrir le laboratoire</button></div><div class="wc-lab-card"><b>📦 Cartes prêtes</b><p class="mut">Tu as actuellement <strong>${ready}</strong> carte(s) différente(s) avec au moins 3 exemplaires et pouvant être améliorées.</p><p class="mut">Les cartes <strong>Légendaire holo full art</strong> ne peuvent pas être améliorées davantage.</p></div></div>`;
    main.insertBefore(el,main.firstChild);
    el.querySelector('#wcLabFusion').onclick=()=>openFusionPicker();
  };
  const _collection=collection;
  collection=function(){main.classList.remove('wc-no-scroll-page');_collection();appendLab()};
  const _all=all;
  all=async function(){await _all();if(window.__wcFocusCard){const c=window.__wcFocusCard;window.__wcFocusCard=null;const box=document.createElement('div');box.className='wc-feature-panel';box.innerHTML=`<div style="display:flex;gap:12px;align-items:center"><img src="${esc(c.img)}" style="width:70px;height:92px;object-fit:cover;border-radius:7px"><div><h3 style="margin:0 0 4px">🎲 Carte découverte : ${esc(c.t)}</h3><div class="mut">${esc(rarityName(c.r))} · ${Number(c.v||0).toLocaleString('fr-FR')} vues Wikipédia</div></div><button class="btn g" id="wcFocusOpen" style="margin-left:auto">Ouvrir la carte</button></div>`;main.insertBefore(box,main.firstChild);box.querySelector('#wcFocusOpen').onclick=()=>openModal(c.id)}};
  document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('#ug');if(b){try{bumpDaily('upgrade',1)}catch(x){}}});
  const oldDaily=DAILY.slice();
  [['discover','🎲 Découvreur','Découvrir 1 carte aléatoire',1,75],['wish','⭐ Collectionneur','Ajouter 1 carte à la liste de souhaits',1,75],['upgrade','⬆️ Expérimentateur','Tenter 1 Card Upgrade',1,100]].forEach(([id,name,desc,goal,reward])=>{if(!DAILY.some(m=>m.id===id))DAILY.push({id,name,goal,reward,d:desc})});
  /* Les missions/succès doivent revenir à leur comportement normal sur les autres onglets. */
  const clearPageClass=()=>{if(tab!==5&&tab!==8)main.classList.remove('wc-no-scroll-page')};
  setInterval(clearPageClass,500);
})();
</script>

<script id="wc-login-milestones-lab-v1">
(()=>{
  if(window.__WCLOGINMILESTONES)return;
  window.__WCLOGINMILESTONES=true;

  const esc2=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  // ---------- Daily login ----------
  const LOGIN_KEY="wc_login_rewards_v1";
  const loginRewards=[
    {d:1,icon:"🪙",title:"Bienvenue",desc:"Récompense de connexion",money:75},
    {d:2,icon:"🎁",title:"Deuxième jour",desc:"Un booster offert",booster:1},
    {d:3,icon:"💎",title:"Troisième jour",desc:"Un booster avec au moins une carte Rare",rare:1},
    {d:4,icon:"🪙",title:"Quatrième jour",desc:"Récompense de connexion",money:150},
    {d:5,icon:"🎁",title:"Cinquième jour",desc:"Un booster offert",booster:1},
    {d:6,icon:"🪙",title:"Sixième jour",desc:"Récompense de connexion",money:300},
    {d:7,icon:"🔥",title:"Semaine complète",desc:"Gros booster spécial + 500 WikiCo",booster:2,money:500}
  ];

  const loginDate=()=>new Date().toISOString().slice(0,10);
  const prevDate=d=>{const x=new Date(d+"T00:00:00Z");x.setUTCDate(x.getUTCDate()-1);return x.toISOString().slice(0,10)};

  function loginState(){
    try{
      const s=JSON.parse(localStorage.getItem(LOGIN_KEY)||"null");
      return s&&typeof s==="object"?s:{last:"",streak:0,pendingRare:0};
    }catch(e){return {last:"",streak:0,pendingRare:0}}
  }
  function saveLogin(s){try{localStorage.setItem(LOGIN_KEY,JSON.stringify(s))}catch(e){}}

  function grantBooster(){
    // A ready slot is made immediately available without touching existing cooldowns negatively.
    try{
      const now=Date.now();
      let idx=boosterCooldowns.findIndex(x=>x>now);
      if(idx<0) idx=0;
      boosterCooldowns[idx]=0;
      saveBoosterCooldowns();
      return true;
    }catch(e){return false}
  }

  function claimLoginIfNeeded(){
    const today=loginDate(),s=loginState();
    if(s.last===today)return {s,reward:null};
    if(s.last===prevDate(today))s.streak=Math.min(7,(+s.streak||0)+1);
    else s.streak=1;
    const day=s.streak;
    const reward=loginRewards[day-1]||loginRewards[0];
    if(reward.money)gain(reward.money);
    for(let i=0;i<(reward.booster||0);i++)grantBooster();
    if(reward.rare)s.pendingRare=1;
    s.last=today;
    saveLogin(s);
    save();
    return {s,reward};
  }

  function loginHTML(){
    const s=loginState();
    const today=loginDate();
    const claimed=s.last===today;
    const current=claimed?Math.max(1,Math.min(7,+s.streak||1)):Math.min(7,(s.last===prevDate(today)?(+s.streak||0)+1:1));
    return `<div class="wc-feature-panel"><h3>🎁 Récompense de connexion</h3>
      <div class="sub">${claimed?"Récompense d’aujourd’hui récupérée. Reviens demain pour continuer la série.":"Connecte-toi chaque jour pour avancer dans la série et obtenir de meilleures récompenses."}</div>
      <div class="wc-login-days">${loginRewards.map((r,i)=>`<div class="wc-login-day ${i+1<current?'done':''} ${i+1===current?'current':''} ${i+1<=current&&claimed?'claimed':''}">
        <div class="wc-login-num">J${i+1}</div><div class="wc-login-icon">${r.icon}</div><b>${esc2(r.title)}</b><small>${esc2(r.desc)}</small>
      </div>`).join('')}</div>
      <div class="mut" style="margin-top:10px;font-size:12px">Série actuelle : <strong>${current}/7 jours</strong> · La série se réinitialise si tu manques une journée.</div>
    </div>`;
  }

  // ---------- Collection milestones ----------
  const MILESTONES=[
    [100,250,"🪙","Premier cap"],
    [500,500,"🎁","Collectionneur"],
    [1000,1000,"💎","Grand collectionneur"],
    [5000,2500,"🏆","Archiviste"],
    [10000,5000,"🔥","Maître de collection"],
    [25000,15000,"👑","Légende de WikiCollect"]
  ];
  const MKEY="wc_collection_milestones_v1";

  function milestoneState(){
    try{return JSON.parse(localStorage.getItem(MKEY)||"{}")||{}}catch(e){return {}}
  }
  function saveMilestones(s){try{localStorage.setItem(MKEY,JSON.stringify(s))}catch(e){}}

  function claimMilestones(){
    const state=milestoneState();
    const unique=Object.values(col).filter(c=>c&&c.n>0).length;
    let changed=false;
    for(const [goal,reward] of MILESTONES){
      if(unique>=goal&&!state[goal]){
        state[goal]=Date.now();
        gain(reward);
        changed=true;
        toast(`🏆 Palier ${goal.toLocaleString("fr-FR")} cartes atteint : +${reward} 🪙`);
      }
    }
    if(changed){saveMilestones(state);save()}
    return {state,unique};
  }

  function milestonesHTML(){
    const {state,unique}=claimMilestones();
    return `<div class="wc-feature-panel"><h3>🏆 Paliers de collection</h3>
      <div class="sub">Chaque palier compte les <strong>cartes différentes</strong> de ta collection.</div>
      <div class="wc-milestones">${MILESTONES.map(([goal,reward,icon,name])=>{
        const done=!!state[goal],pct=Math.min(100,Math.round(unique/goal*100));
        return `<div class="wc-milestone ${done?'done':''}">
          <div class="wc-milestone-top"><span>${icon} <b>${name}</b></span><strong>${goal.toLocaleString("fr-FR")}</strong></div>
          <div class="dbar"><i style="width:${pct}%"></i></div>
          <div class="wc-milestone-bottom"><span>${Math.min(unique,goal).toLocaleString("fr-FR")} / ${goal.toLocaleString("fr-FR")}</span><span>${done?'✅ Réclamé':'🎁 +'+reward+' 🪙'}</span></div>
        </div>`;
      }).join('')}</div>
    </div>`;
  }

  // Make the rare-guaranteed login reward affect the next normal booster.
  const oldBuildPack=buildPack;
  buildPack=async function(minRarity=null){
    const s=loginState();
    let forced=false;
    if(minRarity==null&&s.pendingRare){minRarity=2;forced=true}
    const res=await oldBuildPack(minRarity);
    if(forced){
      s.pendingRare=0;
      saveLogin(s);
      try{save()}catch(e){}
    }
    return res;
  };

  // Enrich profile with login + milestones.
  const oldProfile=profilePage;
  profilePage=function(){
    oldProfile();
    try{
      claimLoginIfNeeded();
      const wrap=document.createElement("div");
      wrap.id="wcLoginMilestones";
      wrap.innerHTML=loginHTML()+milestonesHTML();
      main.appendChild(wrap);
    }catch(e){}
  };

  // Also check milestone rewards after collection changes.
  const oldCollection=collection;
  collection=function(){
    oldCollection();
    try{
      claimMilestones();
      const holder=document.createElement("div");
      holder.id="wcMilestonesCollection";
      holder.innerHTML=milestonesHTML();
      main.appendChild(holder);
    }catch(e){}
  };

  // Claim today's login reward as soon as the game loads, while keeping the visual on Profile.
  try{claimLoginIfNeeded()}catch(e){}

})();
</script>
<style id="wc-login-milestones-css">
.wc-login-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-top:12px}
.wc-login-day{padding:9px 6px;border:1px solid #292331;border-radius:10px;background:#12101a;text-align:center;min-width:0}

<script id="v67-sons">
/* ===== V67 : sons partout ===== */
(function(){
 const sfx=n=>(...a)=>{try{return SFX[n](...a)}catch(e){}};
 // curseur de volume
 const vs=document.getElementById('volSlider');
 if(vs){vs.value=Math.round(SFX.getVol()*100);vs.oninput=()=>SFX.setVol(vs.value/100);vs.onchange=()=>SFX.click()}
 // fenêtre de détail d'une carte
 const _om=openModal;openModal=function(){sfx('open')();return _om.apply(this,arguments)};
 const _cm=closeModal;closeModal=function(){try{if(M.style.display==='flex')SFX.close()}catch(e){}return _cm.apply(this,arguments)};
 // notifications (enchères, ventes, erreurs…)
 const _t=toast;toast=function(m){const t=String(m);
  if(/surench/i.test(t))sfx('outbid')();else if(/^Vendu|vendue/i.test(t))sfx('cash')();else if(/remport|gagn/i.test(t))sfx('win')();
  else if(/^Mise de/i.test(t))sfx('bid')();else if(/impossible|invalide|pas assez|limite|trop basse|annul/i.test(t))sfx('error')();else sfx('notify')();
  return _t.apply(this,arguments)};
 // ouverture du booster : déchirure du haut du sachet + ciseaux pendant la découpe
 let snipT=null;const snipStop=()=>{if(snipT){clearInterval(snipT);snipT=null}};
 const cutting=()=>!!document.querySelector('.pack.cutting:not(.half)');
 const _st=strip;strip=function(){snipStop();sfx('tear')();return _st.apply(this,arguments)};
 // les « snip » s'arrêtent dès que la découpe est finie, annulée ou que le sachet disparaît de l'écran
 new MutationObserver(()=>{const on=cutting();
  if(on&&!snipT){sfx('snip')();snipT=setInterval(()=>{if(!cutting()){snipStop();return}sfx('snip')()},170)}else if(!on)snipStop();
 }).observe(document.body,{subtree:true,attributes:true,attributeFilter:['class'],childList:true});
 // animation légendaire : montée en tension + un son par indice
 const _wo=walkout;walkout=function(c){sfx('riser')(c&&c.r>=7?15:c&&c.r>=6?10:7.5);
  const r=_wo.apply(this,arguments),wt=document.getElementById('wt');
  // si on passe l'animation (ou qu'elle se termine), la montée sonore s'arrête aussitôt
  const ob=new MutationObserver(()=>{if(!document.getElementById('wo')){sfx('riserStop')();ob.disconnect()}});ob.observe(document.body,{childList:true});
  if(wt)new MutationObserver(ms=>{if(ms.some(m=>m.addedNodes.length))sfx('clue')()}).observe(wt,{childList:true});return r};
 // survol des cartes très rares : petit scintillement
 document.addEventListener('pointerover',e=>{const c=e.target.closest&&e.target.closest('.card');if(!c||c.contains(e.relatedTarget))return;
  const m=/\br(\d+)\b/.exec(c.className);if(m&&+m[1]>=7)sfx('hover')(+m[1])},{passive:true});
})();

// ---- dézoom automatique : si l'image n'a pas les proportions du cadre (drapeaux, cartes, tableaux...), on l'affiche en entier ----
(function(){
 function fit(i){try{const w=i.naturalWidth,h=i.naturalHeight,bw=i.clientWidth,bh=i.clientHeight,b=i.closest(".in");if(!b||!w||!h)return;
  b.style.setProperty("--im","url('"+(i.currentSrc||i.src).replace(/'/g,"%27")+"')");if(!bw||!bh)return;
  const c=Math.abs(Math.log((w/h)/(bw/bh)))>.22;i.classList.toggle("fitc",c);b.classList.toggle("fitb",c);i.dataset.f=1}catch(e){}}
 document.addEventListener("load",e=>{const t=e.target;if(t&&t.tagName=="IMG"&&t.closest&&t.closest(".card .in"))fit(t)},true);
 setInterval(()=>document.querySelectorAll(".card .in img:not([data-f])").forEach(i=>{if(i.complete&&i.naturalWidth)fit(i)}),700);
})();

</script>

<script id="wc-save-ui">
(function(){
 const W=window.WCSAVE;if(!W)return;
 const tryf=f=>{try{f()}catch(e){}};
 const autosave=()=>{if(W.block)return;tryf(()=>save());tryf(()=>saveMk());tryf(()=>saveBoosterCooldowns());tryf(()=>saveCollectionState());tryf(()=>W.backup())};
 setInterval(autosave,15000);setTimeout(()=>tryf(()=>W.backup()),4000);
 document.addEventListener("visibilitychange",()=>{if(document.hidden)autosave()});addEventListener("pagehide",autosave);
 const hw=document.getElementById("hw");
 if(hw&&!document.getElementById("svb")){hw.insertAdjacentHTML("afterend",'<button id="svb">💾 Sauvegarde</button>');document.getElementById("svb").onclick=openSave}
 function openSave(){
  autosave();
  let nCards=0,nDiff=0;tryf(()=>{const c=Object.values(col);nDiff=c.length;nCards=c.reduce((s,x)=>s+(x.n||0),0)});
  const t=W.last?new Date(W.last).toLocaleTimeString("fr-FR"):"en cours…";let le=0;tryf(()=>{le=+localStorage.getItem("wc_lastexport")||0});const les=le?new Date(le).toLocaleDateString("fr-FR",{day:"numeric",month:"long"})+" ("+Math.floor((Date.now()-le)/864e5)+" j)":"jamais";
  M.style.display="flex";
  M.innerHTML=`<div class="mbox v2" style="flex-direction:column;max-width:540px"><button class="btn g x" id="mx">✕</button><h2 style="margin:0">💾 Sauvegarde</h2>
  <div class="sub">Ta progression (cartes, pièces, succès, missions, enchères…) est enregistrée automatiquement toutes les 15 secondes dans ce navigateur, avec une copie de secours. Pour la mettre à l'abri ou la changer d'appareil, exporte-la dans un fichier.</div>
  <div class="row"><span>Cartes différentes</span><b>${nDiff.toLocaleString("fr-FR")}</b></div><div class="row"><span>Cartes au total</span><b>${nCards.toLocaleString("fr-FR")}</b></div><div class="row"><span>Pièces</span><b>${(typeof money!=="undefined"?money:0).toLocaleString("fr-FR")} 🪙</b></div><div class="row"><span>Dernière copie de secours</span><b>${t}</b></div><div class="row"><span>Dernier export en fichier</span><b>${les}</b></div>
  <div class="bar" style="margin-top:14px"><button class="btn" id="svx">⬇️ Exporter ma sauvegarde</button><label class="btn g" style="cursor:pointer">⬆️ Importer<input id="svi" type="file" accept=".json,application/json" hidden></label></div><div id="svm" class="sub"></div></div>`;
  document.getElementById("mx").onclick=closeModal;
  document.getElementById("svx").onclick=()=>{autosave();const d=W.snap();const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:"application/json"}));a.download="wikicollect-sauvegarde-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600);tryf(()=>{localStorage.setItem("wc_lastexport",Date.now());localStorage.removeItem("wc_remind_snooze")});document.getElementById("svm").textContent="✅ Sauvegarde exportée ("+Object.keys(d.d).length+" éléments)."};
  document.getElementById("svi").onchange=async e=>{const f=e.target.files[0];if(!f)return;const m=document.getElementById("svm");
   try{const j=JSON.parse(await f.text());if(!j||!j.d||typeof j.d!=="object"||!Object.keys(j.d).some(k=>k.startsWith("wc_")))throw 0;
    const n=Object.keys(JSON.parse(j.d.wc_col||"{}")).length;
    if(!confirm("Remplacer ta progression actuelle par cette sauvegarde ("+n+" cartes différentes, "+(+j.d.wc_money||0)+" pièces) ?\n(Ta progression actuelle est gardée en copie de secours.)"))return;
    W.block=true;try{await W.put("before-import",W.snap())}catch(x){}
    W.keys().forEach(k=>localStorage.removeItem(k));
    Object.keys(j.d).forEach(k=>{if(typeof j.d[k]==="string")localStorage.setItem(k,j.d[k])});
    localStorage.setItem("ACCOUNT_RESET_V105_GUARD","1");sessionStorage.setItem("wc_restored","1");location.reload()}
   catch(err){m.textContent="❌ Fichier invalide : choisis un fichier .json exporté depuis WikiCollect."}}
 }

 /* V99 : rappel de sauvegarde — la progression n'est que dans ce navigateur, donc on rappelle d'exporter un fichier */
 (function(){
  const DAYS=7,SNOOZE=864e5;
  const css=document.createElement("style");css.textContent="#bkRemind{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9500;width:min(560px,calc(100vw - 24px));display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-radius:16px;background:#1d1432;border:1px solid #a855f7;box-shadow:0 14px 40px rgba(0,0,0,.65);color:#f2ecff;font-size:14px;line-height:1.35;animation:bkR .35s ease-out}#bkRemind b{color:#ffd86b}#bkRemind .bkrb{display:flex;gap:8px;margin-left:auto}@keyframes bkR{from{opacity:0;transform:translate(-50%,20px)}}";document.head.appendChild(css);
  const prog=()=>{let n=0;tryf(()=>{n=Object.values(col).filter(c=>c&&c.n>0).length});return n};
  function check(){
   if(document.getElementById("bkRemind")||document.hidden)return;
   if(typeof M!=="undefined"&&M.style.display==="flex")return;
   let le=0,sn=0;tryf(()=>{le=+localStorage.getItem("wc_lastexport")||0;sn=+localStorage.getItem("wc_remind_snooze")||0});
   const n=prog(),age=le?(Date.now()-le)/864e5:Infinity;
   if(Date.now()<sn)return;
   if(le?age<DAYS:n<10)return;   // jamais exporté : on attend 10 cartes différentes ; sinon, rappel après 7 jours
   const txt=le?"Ta dernière sauvegarde en fichier date de <b>"+Math.floor(age)+" jours</b>. Ta progression ne vit que dans ce navigateur : exporte-la pour ne rien perdre.":"Tu as déjà <b>"+n+" cartes différentes</b> mais aucune sauvegarde en fichier. Si tu vides ton navigateur ou changes d'adresse, tout disparaît.";
   const d=document.createElement("div");d.id="bkRemind";d.innerHTML='<span>💾 '+txt+'</span><span class="bkrb"><button class="btn" id="bkrGo">Sauvegarder</button><button class="btn g" id="bkrLater">Plus tard</button></span>';
   document.body.appendChild(d);
   document.getElementById("bkrGo").onclick=()=>{d.remove();openSave()};
   document.getElementById("bkrLater").onclick=()=>{tryf(()=>localStorage.setItem("wc_remind_snooze",Date.now()+SNOOZE));d.remove()};
  }
  setTimeout(check,9000);setInterval(check,5*60*1000);
  window.wcBackupCheck=check;
 })();
})();
</script>
